# Verified XDK 4531 D3D8 / DSOUND structure layout for Crazy Taxi 3: High Roller (USA)
# Passed to `xbe_recomp` via `--xdk config/xdk` (resolves `config/xdk/4531/layout.toml`).
# Every CDevice offset below was byte-verified directly against Crazy Taxi 3's default.xbe D3D section
# (VA 0x000F3800 .. 0x00102240, D3D_Device = 0x001026D0, D3D_pDevice = 0x001051D0).

[layout]
# Header fields (identical to XDK 4831)
CDevice_Push              = 0x0    # verified at D3DDevice_SetTexture 0x000F6222, EndPush 0x000F851A
CDevice_PushThreshold     = 0x4    # verified at D3DDevice_SetTexture 0x000F6224
CDevice_Flags             = 0x8    # verified at CDevice_KickOff 0x000F8525
CDevice_BaseVertex        = 0x1C   # verified at D3DDevice_DrawIndexedVertices 0x000F7C1D
CDevice_Time              = 0x30   # verified at D3DDevice_SetTexture 0x000F61F2, KickOff 0x000F85DC
CDevice_PixelShader       = 0x370  # verified at D3DDevice_SetPixelShader 0x000F800E
CDevice_VertexShader      = 0x380  # verified at D3DDevice_SetVertexShader 0x000F7321
CDevice_IndexBuffer       = 0x38C  # verified at 0x000FB9F0

# Mid-device fields (-0xC0 relative to XDK 4831)
CDevice_ZScale            = 0x450  # -0xC0 from XDK 4831 (0x510)
CDevice_SuperSampleX      = 0x458  # verified at GetViewportOffsetAndScale 0x000F393F
CDevice_SuperSampleY      = 0x45C  # verified at GetViewportOffsetAndScale 0x000F3960
CDevice_BackBufferScale   = 0x468  # verified at D3DDevice_SetRenderTarget 0x000F5492
CDevice_Transforms        = 0x750  # verified at D3DDevice_SetTransform 0x000F5099
CDevice_Viewport          = 0x9D0  # verified at GetViewportOffsetAndScale 0x000F3925 & SetViewport 0x000F5E9D
CDevice_ScreenSpaceOffset = 0x9E8  # verified at D3DDevice_SetScreenSpaceOffset 0x000F6885
CDevice_Textures          = 0xA78  # verified at D3DDevice_SetTexture 0x000F61E3, 0x000F621C
CDevice_Palettes          = 0xA88  # verified at D3DDevice_SetPalette 0x000F6360

# Surface & miniport tail fields (-0x144 for surfaces, verified in Clear/SetRenderTarget/VBlank/KickOff)
CDevice_RenderTarget      = 0x2070 # verified at D3DDevice_Clear 0x000F7642, SetRenderTarget 0x000F5455, GetRenderTarget2 0x000F5D50
CDevice_Depth             = 0x2074 # verified at D3DDevice_Clear 0x000F763B, GetDepthStencilSurface2 0x000F5D70
CDevice_BackBuffer        = 0x207C # verified at D3DDevice_SetRenderTarget 0x000F547F, SetViewport 0x000F5DB0
CDevice_FrontBuffer       = 0x2080 # verified at D3DDevice_SetRenderTarget 0x000F54A3, SetViewport 0x000F5DB8
CDevice_AutoDepth         = 0x2088 # -0x144 from XDK 4831 (0x21CC)
CDevice_VBlankCallback    = 0x2444 # miniport VBlank callback immediately before VBlankEvent
CDevice_VBlankEvent       = 0x2448 # verified at D3DDevice_BlockUntilVerticalBlank 0x000F5267
CDevice_DisplayFlags      = 0x2468 # miniport display flags (+0x20 after VBlankEvent)
CDevice_VBlankCount       = 0x2474 # miniport VBlank counter (+0x2C after VBlankEvent)
CDevice_Field             = 0x2484 # miniport field (+0x3C after VBlankEvent)
CDevice_GammaRamps        = 0x2490 # miniport gamma ramps
CDevice_GammaPending      = 0x2A90 # miniport gamma pending flags
CDevice_SwapCount         = 0x2AD8 # verified at CDevice_KickOff 0x000F85EA & D3DDevice_Swap 0x000F94DB
CDevice_Size              = 0x2AF0 # verified at CDevice::Init 0x000FB492..0x000FB5B5

# D3D8 globals & sub-struct strides
DirtyFlags_Texture        = 0x4800 # verified at D3DDevice_SetTexture 0x000F6256 & SetPixelShader 0x000F8024
TextureState_Stage        = 32     # verified at D3DDevice_SetTextureStageStateNotInline 0x000F431B (shl ecx, 5)
Stream_Size               = 12     # verified at CDevice::Uninitialize 0x000FBA95 (add edi, 0x0C; cmp edi, 0xC0)
Stream_Stride             = 0x0
Stream_Buffer             = 0x8    # verified at CDevice::Uninitialize 0x000FBA70 (0x001051E0 = D3D_Streams + 8)
PixelShader_Definition    = 0x8

# DSOUND
CDirectSoundStream_Vtable  = 0x0
CDirectSoundStream_Vtable2 = 0x4
EffectsImage_Skip0         = 0x804
EffectsImage_Skip1         = 0x80C
EffectsImage_Desc          = 0x818

# XAPI XPP device type record (verified at 0x001244E3..0x00124502)
XPP_Current               = 0x0
XPP_Changed               = 0x4
XPP_Previous              = 0x8
